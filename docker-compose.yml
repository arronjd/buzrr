
# Buzrr - Do Drop Inn
# Docker host: docker-01 / 192.168.20.11
# Internal HTTPS via Nginx Proxy Manager
# Database and Redis use local Docker volumes.
#
# IMPORTANT:
# Set BUZRR_DB_PASSWORD in Portainer environment variables.
# Keep this file complete, including the volumes section at the bottom.

x-database-env: &database-env
  DATABASE_URL: postgresql://buzrr:${BUZRR_DB_PASSWORD:?Set BUZRR_DB_PASSWORD in Portainer}@postgres:5432/buzrr
  DIRECT_URL: postgresql://buzrr:${BUZRR_DB_PASSWORD:?Set BUZRR_DB_PASSWORD in Portainer}@postgres:5432/buzrr

x-ai-env-files: &ai-env-files
  - path: .env
    required: false
  - path: apps/ai/.env
    required: false

x-ai-env: &ai-env
  AI_DATABASE_URL: postgresql://buzrr:${BUZRR_DB_PASSWORD:?Set BUZRR_DB_PASSWORD in Portainer}@postgres:5432/buzrr
  REDIS_URL: redis://redis:6379
  AI_WEB_ORIGIN: ${PUBLIC_WEB_URL:-https://buzrr.myhomelab.vip}
  AI_BUZRR_API_URL: ${AI_BUZRR_API_URL:-http://server:3001}

services:

  postgres:
    image: pgvector/pgvector:pg16
    container_name: buzrr-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: buzrr
      POSTGRES_PASSWORD: ${BUZRR_DB_PASSWORD:?Set BUZRR_DB_PASSWORD in Portainer}
      POSTGRES_DB: buzrr
    volumes:
      - buzrr-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buzrr -d buzrr"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  redis:
    image: redis:7-alpine
    container_name: buzrr-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - buzrr-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 3s

  auth-secret:
    image: redis:7-alpine
    restart: "no"
    command:
      - sh
      - -c
      - "[ -s /secrets/auth-secret ] || head -c 32 /dev/urandom | base64 > /secrets/auth-secret; chmod 444 /secrets/auth-secret"
    volumes:
      - buzrr-secrets:/secrets

  migrate:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    image: buzrr-server
    restart: "no"
    working_dir: /app/packages/prisma
    command:
      - sh
      - -c
      - "node scripts/deploy.mjs && node scripts/seed-duel-starter.mjs"
    environment:
      <<: *database-env
    depends_on:
      postgres:
        condition: service_healthy

  server:
    image: buzrr-server
    restart: unless-stopped
    command:
      - sh
      - -c
      - 'export BETTER_AUTH_SECRET="$${BETTER_AUTH_SECRET:-$$(cat /run/buzrr/auth-secret)}" && exec node /app/apps/server/dist/src/main.js'
    environment:
      <<: *database-env
      REDIS_URL: redis://redis:6379
      PORT: "3001"
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      WEB_ORIGIN: ${PUBLIC_WEB_URL:-https://buzrr.myhomelab.vip}
      BILLING: "OFF"
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      STORAGE_LOCAL_DIR: /data/uploads
      STORAGE_PUBLIC_URL: ${PUBLIC_API_URL:-https://buzrr-api.myhomelab.vip}/uploads
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      - "192.168.20.11:3101:3001"
    volumes:
      - buzrr-uploads:/data/uploads
      - buzrr-secrets:/run/buzrr:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      auth-secret:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        PUBLIC_API_URL: ${PUBLIC_API_URL:-https://buzrr-api.myhomelab.vip}
        PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-https://buzrr.myhomelab.vip}
        PUBLIC_AI_API_URL: ${PUBLIC_AI_API_URL:-}
    image: buzrr-web
    restart: unless-stopped
    command:
      - sh
      - -c
      - 'export BETTER_AUTH_SECRET="$${BETTER_AUTH_SECRET:-$$(cat /run/buzrr/auth-secret)}" && exec node /app/apps/web/server.js'
    environment:
      <<: *database-env
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      BETTER_AUTH_URL: ${PUBLIC_WEB_URL:-https://buzrr.myhomelab.vip}
      TRUSTED_ORIGINS: ${PUBLIC_WEB_URL:-https://buzrr.myhomelab.vip},${PUBLIC_API_URL:-https://buzrr-api.myhomelab.vip}
      AUTH_EMAIL_PASSWORD: ${AUTH_EMAIL_PASSWORD:-ON}
      AUTH_EMAIL_SIGNUP: ${AUTH_EMAIL_SIGNUP:-ON}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      API_INTERNAL_URL: http://server:3001
      RATELIMIT: "OFF"
      LANDING_VIDEO_URL: ${LANDING_VIDEO_URL:-}
    ports:
      - "192.168.20.11:3100:3000"
    volumes:
      - buzrr-secrets:/run/buzrr:ro
    depends_on:
      server:
        condition: service_started

  # Optional AI Knowledge Spaces
  # Enable only after the initial installation works.

  ai-migrate:
    profiles: ["ai"]
    build:
      context: ./apps/ai
    image: buzrr-ai
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    env_file: *ai-env-files
    environment:
      <<: *ai-env
      BETTER_AUTH_SECRET: migrations-do-not-verify-tokens
    depends_on:
      postgres:
        condition: service_healthy

  ai:
    profiles: ["ai"]
    image: buzrr-ai
    container_name: buzrr-ai
    restart: unless-stopped
    command:
      - sh
      - -c
      - 'export BETTER_AUTH_SECRET="$${BETTER_AUTH_SECRET:-$$(cat /run/buzrr/auth-secret)}" && exec uvicorn buzrr_ai.main:app --host 0.0.0.0 --port 3002'
    env_file: *ai-env-files
    environment:
      <<: *ai-env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3002:3002"
    volumes:
      - buzrr-secrets:/run/buzrr:ro
    depends_on:
      ai-migrate:
        condition: service_completed_successfully
      auth-secret:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  ai-worker:
    profiles: ["ai"]
    image: buzrr-ai
    container_name: buzrr-ai-worker
    restart: unless-stopped
    command:
      - sh
      - -c
      - 'export BETTER_AUTH_SECRET="$${BETTER_AUTH_SECRET:-$$(cat /run/buzrr/auth-secret)}" && exec arq buzrr_ai.worker.WorkerSettings'
    env_file: *ai-env-files
    environment:
      <<: *ai-env
    volumes:
      - buzrr-secrets:/run/buzrr:ro
    depends_on:
      ai-migrate:
        condition: service_completed_successfully
      auth-secret:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # Optional local Ollama AI server.
  # Not enabled during the initial deployment.

  ollama:
    profiles: ["ollama"]
    image: ollama/ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - buzrr-ollama:/root/.ollama

# IMPORTANT: Keep this entire section.
# Without it, Docker Compose will report undefined volumes.

volumes:
  buzrr-postgres-data:
  buzrr-redis-data:
  buzrr-uploads:
  buzrr-secrets:
  buzrr-ollama:
