# Buzrr — Do Drop Inn / docker-01 (192.168.20.11)
#
#     docker compose up -d        # → https://buzrr.myhomelab.vip via NPM
#
# That builds and starts Postgres, Redis, database migrations, the API (:3001)
# and the web app (:3000). Sign-in is local email + password, images are kept
# on a Docker volume, and an auth secret is generated on first boot — nothing
# here needs the internet once the images are built. Configure it with a `.env`
# file next to this one (every knob is listed in `.env.example`).
#
# Optional extras:
#
#     docker compose --profile ai up -d       # Knowledge Spaces (apps/ai)
#     docker compose --profile ollama up -d   # a local model server
#
# Serving other machines (Do Drop Inn LAN): set PUBLIC_WEB_URL / PUBLIC_API_URL
# to addresses browsers can reach, then `docker compose up -d --build` — the
# API URL is compiled into the web bundle.
#
# Developing Buzrr instead? `yarn setup` + `yarn dev` run the apps on your
# machine and use only the `postgres` and `redis` services from this file.
#
#     docker compose down         # stop (data is kept in named volumes)
#     docker compose down -v      # stop and wipe everything

x-database-env: &database-env
  DATABASE_URL: postgresql://buzrr:${BUZRR_DB_PASSWORD:?Set BUZRR_DB_PASSWORD in Portainer}@postgres:5432/buzrr
  DIRECT_URL: postgresql://buzrr:${BUZRR_DB_PASSWORD:?Set BUZRR_DB_PASSWORD in Portainer}@postgres:5432/buzrr

# Keep secrets in Portainer environment variables; never commit real passwords to GitHub.
# The AI containers take their model settings (GEMINI_API_KEY or LLM_*, plus
# AI_GENERATION_MODEL / AI_EMBEDDING_MODEL) from env files — `.env` here, then
# apps/ai/.env — so these are only the values that must point inside Docker.
x-ai-env-files: &ai-env-files
  - path: .env
    required: false
  - path: apps/ai/.env
    required: false
x-ai-env: &ai-env
  AI_DATABASE_URL: postgresql://buzrr:${BUZRR_DB_PASSWORD:?Set BUZRR_DB_PASSWORD in Portainer}@postgres:5432/buzrr
  REDIS_URL: redis://redis:6379
  AI_WEB_ORIGIN: ${PUBLIC_WEB_URL:-https://buzrr.myhomelab.vip}
  AI_BUZRR_API_URL: ${AI_BUZRR_API_URL:-http://server:3001}

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: buzrr-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: buzrr
      POSTGRES_PASSWORD: ${BUZRR_DB_PASSWORD:?Set BUZRR_DB_PASSWORD in Portainer}
      POSTGRES_DB: buzrr
    volumes:
      - buzrr-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buzrr -d buzrr"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  redis:
    image: redis:7-alpine
    container_name: buzrr-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - buzrr-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 3s

  # Mints the shared BETTER_AUTH_SECRET once, into a volume, unless you set
  # one in .env. Web, API and AI all read the same file — they must agree.
  auth-secret:
    image: redis:7-alpine
    restart: "no"
    command:
      - sh
      - -c
      - "[ -s /secrets/auth-secret ] || head -c 32 /dev/urandom | base64 > /secrets/auth-secret; chmod 444 /secrets/auth-secret"
    volumes:
      - buzrr-secrets:/secrets

  migrate:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    image: buzrr-server
    restart: "no"
    working_dir: /app/packages/prisma
    # Applies committed migrations (creating and baselining the schema on a
    # fresh database — see scripts/deploy.mjs), then makes sure the duel pool
    # isn't empty (idempotent starter pack).
    command:
      - sh
      - -c
      - "node scripts/deploy.mjs && node scripts/seed-duel-starter.mjs"
    environment:
      <<: *database-env
    depends_on:
      postgres:
        condition: service_healthy

  server:
    image: buzrr-server
    restart: unless-stopped
    # Prefer BETTER_AUTH_SECRET from .env; fall back to the generated one.
    command:
      - sh
      - -c
      - 'export BETTER_AUTH_SECRET="$${BETTER_AUTH_SECRET:-$$(cat /run/buzrr/auth-secret)}" && exec node /app/apps/server/dist/src/main.js'
    environment:
      <<: *database-env
      REDIS_URL: redis://redis:6379
      PORT: "3001"
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      WEB_ORIGIN: ${PUBLIC_WEB_URL:-https://buzrr.myhomelab.vip}
      # Billing is a hosted-service feature; self-hosted means Pro limits.
      BILLING: "OFF"
      # Question images: local disk (the volume below) unless you choose
      # cloudinary or s3 — see .env.example.
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      STORAGE_LOCAL_DIR: /data/uploads
